name: Refresh portfolio dependencies

on:
  push:
    branches:
      - feat/portfolio-95-plus
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/portfolio-95-plus

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Remove unused packages
        run: npm uninstall @emailjs/browser react-intersection-observer react-type-animation @eslint/eslintrc

      - name: Upgrade Next.js security line
        run: |
          npm install next@16.3.0 --save-exact
          npm install eslint-config-next@16.3.0 --save-dev --save-exact

      - name: Apply compatible security fixes
        run: npm audit fix --package-lock-only

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit refreshed dependency graph
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: refresh secure dependency graph'
          git push origin HEAD:feat/portfolio-95-plus
