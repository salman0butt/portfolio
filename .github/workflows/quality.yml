name: Portfolio quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: One-time secure dependency refresh
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/portfolio-95-plus'
        run: |
          npm uninstall @emailjs/browser react-intersection-observer react-type-animation @eslint/eslintrc
          npm install next@16.3.0 --save-exact
          npm install eslint-config-next@16.3.0 --save-dev --save-exact
          npm audit fix --package-lock-only
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json package-lock.json
            git commit -m 'chore: refresh secure dependency graph'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e
