name: Refresh MCP lockfile

on:
  push:
    branches:
      - fix/portfolio-mcp-official-handler

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/portfolio-mcp-official-handler

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Remove temporary workflow and commit lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-mcp-lock.yml
          git add package-lock.json
          git commit -m "chore: refresh lockfile for official MCP handler"
          git push origin HEAD:fix/portfolio-mcp-official-handler
