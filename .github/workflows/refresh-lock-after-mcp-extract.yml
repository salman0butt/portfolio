name: Refresh lockfile after MCP extraction

on:
  push:
    branches:
      - refactor/extract-portfolio-mcp
    paths:
      - .github/workflows/refresh-lock-after-mcp-extract.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-portfolio-mcp
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: rm .github/workflows/refresh-lock-after-mcp-extract.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-lock-after-mcp-extract.yml
          git commit -m "chore: refresh lockfile after MCP extraction"
          git push origin HEAD:refactor/extract-portfolio-mcp
