<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Production incident feedback loop</title>
  <desc id="desc">A diagram showing detection, mitigation, diagnosis, fix, verification, and prevention.</desc>
  <rect width="1400" height="760" rx="36" fill="#f8fafc"/>
  <text x="90" y="110" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800">Production incidents are engineering feedback</text>
  <text x="90" y="160" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="23">The senior move is to restore service first, then improve the system.</text>

  <g font-family="Inter,Arial,sans-serif">
    <g>
      <rect x="90" y="260" width="180" height="120" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="120" y="310" fill="#059669" font-size="17" font-weight="800">01</text>
      <text x="120" y="345" fill="#0f172a" font-size="25" font-weight="750">Detect</text>
      <text x="120" y="372" fill="#64748b" font-size="15">metrics / alert</text>
    </g>
    <g>
      <rect x="320" y="260" width="180" height="120" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="350" y="310" fill="#059669" font-size="17" font-weight="800">02</text>
      <text x="350" y="345" fill="#0f172a" font-size="25" font-weight="750">Mitigate</text>
      <text x="350" y="372" fill="#64748b" font-size="15">protect users</text>
    </g>
    <g>
      <rect x="550" y="260" width="180" height="120" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="580" y="310" fill="#059669" font-size="17" font-weight="800">03</text>
      <text x="580" y="345" fill="#0f172a" font-size="25" font-weight="750">Diagnose</text>
      <text x="580" y="372" fill="#64748b" font-size="15">trace the cause</text>
    </g>
    <g>
      <rect x="780" y="260" width="180" height="120" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="810" y="310" fill="#059669" font-size="17" font-weight="800">04</text>
      <text x="810" y="345" fill="#0f172a" font-size="25" font-weight="750">Fix</text>
      <text x="810" y="372" fill="#64748b" font-size="15">small safe change</text>
    </g>
    <g>
      <rect x="1010" y="260" width="180" height="120" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="1040" y="310" fill="#059669" font-size="17" font-weight="800">05</text>
      <text x="1040" y="345" fill="#0f172a" font-size="25" font-weight="750">Verify</text>
      <text x="1040" y="372" fill="#64748b" font-size="15">watch signals</text>
    </g>
  </g>

  <g stroke="#10b981" stroke-width="4" fill="none">
    <path d="M270 320 H310"/>
    <path d="M500 320 H540"/>
    <path d="M730 320 H770"/>
    <path d="M960 320 H1000"/>
  </g>
  <g fill="#10b981">
    <path d="M310 320 l-12 -8 v16z"/>
    <path d="M540 320 l-12 -8 v16z"/>
    <path d="M770 320 l-12 -8 v16z"/>
    <path d="M1000 320 l-12 -8 v16z"/>
  </g>

  <rect x="350" y="500" width="700" height="140" rx="28" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <text x="400" y="555" fill="#065f46" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">06 / PREVENT THE SAME CLASS OF FAILURE</text>
  <text x="400" y="595" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Add guardrails, tests, observability, and simpler boundaries.</text>
  <path d="M1100 390 C1100 470 1040 500 1000 520" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 10"/>
  <path d="M350 570 C190 570 160 470 180 390" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 10"/>
</svg>