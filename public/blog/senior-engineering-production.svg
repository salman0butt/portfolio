<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Senior software engineering in production</title>
  <desc id="desc">A visual showing product intent flowing through architecture, delivery, observability, and learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07120f"/>
      <stop offset="1" stop-color="#10221c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="90" r="260" fill="#10b981" opacity=".08"/>
  <circle cx="140" cy="790" r="300" fill="#34d399" opacity=".06"/>
  <text x="120" y="155" fill="#a7f3d0" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="5">ENGINEERING IN PRODUCTION</text>
  <text x="120" y="235" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="800">Senior engineering is a system,</text>
  <text x="120" y="305" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="800">not a bigger pile of code.</text>
  <text x="120" y="365" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="28">Problem framing → architecture → safe delivery → observability → learning</text>

  <g filter="url(#shadow)">
    <rect x="120" y="480" width="250" height="150" rx="24" fill="#101c18" stroke="#2f4f44"/>
    <text x="150" y="530" fill="#6ee7b7" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">01 / INTENT</text>
    <text x="150" y="575" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700">Understand</text>
    <text x="150" y="610" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="18">users + constraints</text>

    <rect x="420" y="480" width="250" height="150" rx="24" fill="#101c18" stroke="#2f4f44"/>
    <text x="450" y="530" fill="#6ee7b7" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">02 / DESIGN</text>
    <text x="450" y="575" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700">Choose</text>
    <text x="450" y="610" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="18">boundaries + trade-offs</text>

    <rect x="720" y="480" width="250" height="150" rx="24" fill="#101c18" stroke="#2f4f44"/>
    <text x="750" y="530" fill="#6ee7b7" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">03 / DELIVERY</text>
    <text x="750" y="575" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700">Ship safely</text>
    <text x="750" y="610" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="18">tests + rollback</text>

    <rect x="1020" y="480" width="250" height="150" rx="24" fill="#101c18" stroke="#2f4f44"/>
    <text x="1050" y="530" fill="#6ee7b7" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">04 / SIGNALS</text>
    <text x="1050" y="575" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700">Observe</text>
    <text x="1050" y="610" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="18">logs + metrics + users</text>

    <rect x="1320" y="480" width="160" height="150" rx="24" fill="url(#accent)"/>
    <text x="1350" y="530" fill="#052e22" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">05</text>
    <text x="1350" y="575" fill="#052e22" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800">Learn</text>
    <text x="1350" y="610" fill="#064e3b" font-family="Inter,Arial,sans-serif" font-size="17">repeat</text>
  </g>

  <g fill="none" stroke="#34d399" stroke-width="5" opacity=".72">
    <path d="M370 555 H410"/>
    <path d="M670 555 H710"/>
    <path d="M970 555 H1010"/>
    <path d="M1270 555 H1310"/>
  </g>
  <g fill="#34d399">
    <path d="M410 555 l-13 -9 v18 z"/>
    <path d="M710 555 l-13 -9 v18 z"/>
    <path d="M1010 555 l-13 -9 v18 z"/>
    <path d="M1310 555 l-13 -9 v18 z"/>
  </g>

  <path d="M1400 650 C1400 770 220 770 220 650" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 12"/>
  <text x="640" y="805" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="20">feedback turns delivery into an engineering loop</text>
</svg>